spring.application.name=agencia

# ---- ICEIBank ----
# OFFSET pessoal (dois ultimos digitos da matricula/RA). Necessario apenas em
# maquina compartilhada do laboratorio; 0 desliga o deslocamento de portas.
iceibank.offset=0

# Numero total de agencias do sistema (fixado em 3 no Sprint 1).
iceibank.numero-agencias=3

# Identidade desta instancia. Sobrescrever ao subir cada agencia:
#   --iceibank.id=1
iceibank.id=0

# ---- RabbitMQ (Sprint 2) ----
# A URL do broker (CloudAMQP ou local) contem usuario e senha, por isso NUNCA
# fica no repositorio: vem da variavel de ambiente RABBITMQ_URL.
spring.rabbitmq.addresses=${RABBITMQ_URL}

jwt.segredo=iceibank-sprint1-chave-secreta-para-assinatura-hs256-2026
jwt.expiracao-minutos=15
